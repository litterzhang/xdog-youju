# Site include for /etc/nginx/conf.d/youju.conf, not a global nginx.conf.
# API local host: youju.942295.xyz; client API origin: youju-h.942295.xyz.
# Follow the reference ingress that strips "-h" before forwarding local HTTPS.
# H5 host: youjuh5.942295.xyz, served directly from the built static root.
# Requires an API process on 127.0.0.1:8089; no Taro watch server is needed.
# Install/reload the shared Nginx only after explicit operator confirmation.

upstream youju-backend {
    server 127.0.0.1:8089;
}

server {
    listen 80;
    listen [::]:80;
    server_name youju.942295.xyz youjuh5.942295.xyz;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name youjuh5.942295.xyz;

    ssl_certificate /etc/nginx/ssl/942295/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/942295/key.pem;

    access_log /var/log/nginx/youjuh5.access.log main;
    error_log /var/log/nginx/youjuh5.error.log;

    root /home/zhang/workspace/xdog-youju/client/dist/h5;
    index index.html;
    disable_symlinks on from=$document_root;

    # The separate API host owns authentication and administration endpoints.
    location = /api {
        return 404;
    }
    location ^~ /api/ {
        return 404;
    }

    location ~ (^|/)\. {
        return 404;
    }
    location ~* \.(map|pem|key|py|toml|lock|sqlite3|env)$ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Missing build assets return 404, never a misleading HTML response.
    location /assets/ {
        try_files $uri =404;
    }
    # Taro currently emits stable JS/CSS names: revalidate across deployments.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~* \.(png|jpe?g|gif|svg|webp|ico|woff2?|ttf|otf)$ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name youju.942295.xyz;

    ssl_certificate /etc/nginx/ssl/942295/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/942295/key.pem;

    access_log /var/log/nginx/youju.access.log main;
    error_log /var/log/nginx/youju.error.log;
    client_max_body_size 1m;

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-NginX-Proxy true;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # No URI/trailing slash: keep the original /api/ prefix for Flask.
        proxy_pass http://youju-backend;
    }

    location / {
        return 404;
    }
}
